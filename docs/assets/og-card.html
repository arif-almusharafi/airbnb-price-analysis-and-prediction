<!DOCTYPE html>
<!-- Source of assets/og-image.png (the LinkedIn preview card, 1200 x 627).
     To rebuild it, open this file in a browser at 1200 x 627 and take a screenshot. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Preview card</title>
  <style>
    body { margin: 0; width: 1200px; height: 627px; overflow: hidden; background: #faf8f5; color: #1c2230;
      font-family: system-ui, "Segoe UI", Arial, sans-serif; position: relative; }
    body::before { content: ""; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(29deg, rgba(28,34,48,.06) 0 1px, transparent 1px 22px),
        repeating-linear-gradient(119deg, rgba(28,34,48,.06) 0 2px, transparent 2px 88px);
      -webkit-mask-image: radial-gradient(ellipse at 90% 10%, #000, transparent 75%); }
    .wrap { position: relative; padding: 72px 80px; }
    .eyebrow { font-family: Consolas, monospace; font-size: 24px; color: #b23a2e; font-weight: 700; }
    h1 { font-family: "Palatino Linotype", Georgia, serif; font-size: 76px; line-height: 1.08; margin: 24px 0; max-width: 900px; }
    p { font-size: 30px; color: #4e5666; margin: 0; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: #b23a2e; }
    .by { position: absolute; left: 80px; bottom: 56px; font-size: 26px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">DATA SCIENCE &middot; NEW YORK CITY &middot; 2019</div>
    <h1>Airbnb Price Analysis and Prediction</h1>
    <p>48,895 listings &middot; 5 regression models &middot; live price predictor</p>
  </div>
  <div class="by">Arif Al-Musharafi</div>
  <div class="bar"></div>
</body>
</html>
